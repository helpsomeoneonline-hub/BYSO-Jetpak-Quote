name: Temporary Encrypted APK Bridge

on:
  push:
    paths:
      - ".github/workflows/temp-encrypted-apk-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted Anime Voice Reader v1.16.1
        run: |
          curl -fL "https://litter.catbox.moe/126wnh.enc" \
            -o AnimeVoiceReader-v1.16.1-debug.apk.enc
          test "$(stat -c%s AnimeVoiceReader-v1.16.1-debug.apk.enc)" -gt 57000000

      - name: Upload encrypted transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVoiceReader-v1.16.1-encrypted
          path: AnimeVoiceReader-v1.16.1-debug.apk.enc
          if-no-files-found: error
