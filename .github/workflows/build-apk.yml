name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android APK
        id: compile
        run: gradle assembleDebug
      - name: Sign and verify permanent APK certificate
        id: permanent_sign
        continue-on-error: true
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash scripts/sign-github-apk.sh app/build/outputs/apk/debug/app-debug.apk

      # Direct .apk file in Releases, not GitHub's automatic ZIP-wrapped artifacts.
      # Debug-signed APKs are explicitly labelled NEW INSTALL ONLY.
      - name: Publish direct APK download in GitHub Releases
        if: steps.compile.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_OUTCOME: ${{ steps.permanent_sign.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SIGN_OUTCOME" == "success" ]]; then
            TAG="v1.16.4"
            FILE="BYSO-JetPak-Quote-v1.16.4-UPGRADE-COMPATIBLE.apk"
            TITLE="BYSO JetPak Quote v1.16.4"
            NOTES="Signed with the repository's verified permanent certificate. Can update existing installations signed with that same certificate."
            PRERELEASE=()
          else
            TAG="v1.16.4-debug"
            FILE="BYSO-JetPak-Quote-v1.16.4-DEBUG-NEW-INSTALL-ONLY.apk"
            TITLE="BYSO JetPak Quote v1.16.4 — new installation only"
            NOTES="Direct Android APK download. The repository's permanent signing certificate was not available/verified. This disposable debug-signed build is for NEW INSTALLATIONS ONLY and generally cannot update an existing installation. Uninstalling an old app may erase its saved settings."
            PRERELEASE=(--prerelease)
            echo "::warning::Publishing debug-signed new-install APK only; cannot claim upgrade compatibility."
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" "${PRERELEASE[@]}"
          fi
          echo "Direct APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload upgrade-compatible APK (verified permanent certificate only)
        if: steps.permanent_sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BYSO-JetPak-Quote-APK-UPGRADE-COMPATIBLE
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK fallback (NEW INSTALL ONLY)
        if: steps.compile.outcome == 'success' && steps.permanent_sign.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BYSO-JetPak-Quote-v1.16.4-DEBUG-NEW-INSTALL-ONLY
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
